<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de boas-vindas!</title>
</head>
<body>
    <h1>Boas-Vindas</h1>

    <input type="button" value="Inicie o Desafio" class="botao">

    <script>
        let botao = window.document.querySelector(".botao");

        botao.addEventListener('click', ()=>{
            let nome = window.prompt("Qual é o seu nome ?");
            let idade = window.prompt(`Olá, ${nome}! Quantos anos você tem ?`);

            window.alert(`Acabei de conhecer o ${nome}, que tem ${idade} anos de idade!`);

        });
    </script>
</body>
</html>
