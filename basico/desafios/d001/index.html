<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens</title>
</head>
<body>
    <h1>Desafio das Mensagens</h1>
    <input type="button" value="Botão 1" class="botoes">
    <input type="button" value="Botão 2" class="botoes">
    <input type="button" value="Botão 3" class="botoes">

    <script>
        const botoes = document.querySelectorAll('.botoes');

        botoes.forEach((botao, index) =>{
           botao.addEventListener('click', () =>{
            let novoIndex = index+1
                window.alert(`Você clicou no ${novoIndex} Botão`);
           }); 
            
        });
    </script>
</body>
</html>
