<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Multas</title>
</head>
<body>
    <h1>Sistema de Multas</h1>
    velocidade do carro: <input type="number" name="txtvel" id="txtvel"> Km/h
    <input type="button" value="verificar" onclick="calcular()">
    <div id="res"></div>

    <script>
        function calcular(){
            let txtVel = window.document.querySelector('input#txtvel');
            let res = window.document.getElementById("res");

            let vel = Number(txtVel.value);

            if(vel > 50){
                res.innerText = `Velocidade acima de 50km/h. Você foi multado!`
            } else{
                res.innerText = `Velocidade abaixo de 50km/h. Prossiga a viagem.`
            }
            
        }
    </script>
</body>
</html>
